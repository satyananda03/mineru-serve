services:
  api:
    build: .
    container_name: mineru-serve
    restart: unless-stopped
    env_file: .env
    environment:
      UNOSERVER_HOST: unoserver
      UNOSERVER_PORT: "2003"
    ports:
      - "8001:8000"
    depends_on:
      unoserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # LibreOffice yang selalu panas untuk konversi office→PDF. Satu instance melayani satu
  # dokumen pada satu waktu — konkurensi dinaikkan lewat `replicas`, bukan lewat client
  # (MAX_PARALLEL_OFFICE_CONVERT harus <= replicas). Nama service = default UNOSERVER_HOST;
  # DNS compose round-robin ke tiap replica, tiap `unoconvert` = koneksi baru.
  unoserver:
    image: ghcr.io/unoconv/unoserver-docker:0.4.4  # berisi unoserver 3.4 = pyproject
    restart: always
    mem_limit: 1g
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 2003), 3)\""]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
