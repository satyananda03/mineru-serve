x-app: &app
  image: mineru-serve-app
  build:
    context: .
    target: app
  restart: unless-stopped
  env_file: .env
  environment: &app-environment
    MINERU_API_URL: http://mineru:8000
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  api:
    <<: *app
    container_name: mineru-serve-api
    ports:
      - "${HOST_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["celery", "-A", "src.jobs.celery_app", "worker", "--loglevel=info"]
    environment:
      <<: *app-environment
      UNOSERVER_HOST: unoserver
      UNOSERVER_PORT: "2003"
    depends_on:
      mineru:
        condition: service_healthy
      unoserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.jobs.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  mineru:
    image: mineru-serve-mineru:torch
    build:
      context: .
      target: mineru
      args:
        BACKEND: torch
    restart: unless-stopped
    command: ["--concurrency", "${MINERU_CONCURRENCY:-1}", "--retention-seconds", "3600"]
    environment:
      MINERU_DEVICE_MODE: cuda
      TORCH_INFERENCE_PRECISION: ${TORCH_INFERENCE_PRECISION:-fp32}
      FORMULA_RECOGNITION: ${FORMULA_RECOGNITION:-on}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  unoserver:
    image: ghcr.io/unoconv/unoserver-docker:0.4.4  
    restart: always
    mem_limit: 1g
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 2003), 3)\""]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s